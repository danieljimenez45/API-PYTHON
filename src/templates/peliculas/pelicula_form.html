{% extends "fragments/base.html" %}

{% block content %}
    <div class="form-container">
        <h1>📝 Insertar Pelicula</h1>
        <form method="post" action="/peliculas/new">
            <div class="form-group">
                <label for="titulo">Título de la pelicula:</label><br>
                <input type="text" id="titulo" name="titulo" placeholder="Nombre de la pelicula">
            </div>

            <div class="form-group">
                <label for="genero">Género de la pelicula:</label><br>
                <input type="text" id="genero" name="genero" placeholder="Genero de la pelicula">
            </div>

            <div class="form-group">
                <label for="Duracion">Duracion de la pelicula (minutos):</label><br>
                <input type="text" id="duracion" name="duracion" placeholder="Duracion de la pelicula (en minutos)">
            </div>

            <div class="form-group">
                <label for="sinopsis">Sinopsis de la pelicula:</label><br>
                <input type="text" id="sinopsis" name="sinopsis" placeholder="Sinopsis de la pelicula">
            </div>

            <div class="form-group">
                <label for="actores_principales">Actores principales de la pelicula:</label><br>
                <input type="text" id="actores_principales" name="actores_principales" placeholder="Actores principales de la pelicula">
            </div>

            <div class="form-group">
                <label for="actores_secundarios">Actores_secundarios de la pelicula:</label><br>
                <input type="text" id="actores_secundarios" name="actores_secundarios" placeholder="Actores_secundarios de la pelicula">
            </div>

            <div class="form-group">
                <label for="director">Director de la pelicula:</label><br>
                <input type="text" id="director" name="director" placeholder="Director de la pelicula">
            </div>

            <button type="submit">Guardar Pelicula</button>
        </form>
        <br>
        <div>
        <a href="/peliculas" class="back-link">← Volver a la lista de peliculas</a>
        </div>
    </div>
{% endblock %}
