name: fastapi-peliculas
services: 
  fastapi-app:  
    build:  
      context: .  
      dockerfile: Dockerfile  
    container_name: fastapi-app-peliculas
    restart: always  
    ports:  
      - "8000:8000"  
    depends_on:  
      - fastapi-db
      
  fastapi-db:  
    image: postgres:16
    container_name: fastapi-db-peliculas  
    environment:  
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:  
      - "5432:5432"